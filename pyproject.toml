[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openreview-crawler"
version = "0.1.0"
description = "Daily scraper for OpenReview ICLR data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenReview Crawler" }
]
dependencies = [
  "openreview-py>=1.5.2",
  "requests>=2.31.0",
  "tenacity>=8.2.0",
  "tqdm>=4.66.0",
  "docling>=0.9.0",
  "docling-core>=0.9.0",
  "Pillow>=9.5.0"
]

[project.scripts]
iclr-scrape = "openreview_crawler.__main__:main"
